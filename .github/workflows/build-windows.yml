name: Build Windows App

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install backend dependencies (and native sqlite3 for Windows)
        working-directory: backend
        run: npm install

      - name: Download Node.js Sidecar for Windows
        shell: pwsh
        run: |
          # Descargamos el binario de Node.js oficial para Windows
          Invoke-WebRequest -Uri "https://nodejs.org/dist/v22.14.0/node-v22.14.0-win-x64.zip" -OutFile "node.zip"
          Expand-Archive -Path "node.zip" -DestinationPath "."
          
          # Creamos la carpeta binaries si no existe y copiamos el .exe con el nombre especial que pide Tauri
          New-Item -ItemType Directory -Force -Path "frontend/src-tauri/binaries"
          Copy-Item -Path "node-v22.14.0-win-x64/node.exe" -Destination "frontend/src-tauri/binaries/node-x86_64-pc-windows-msvc.exe"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build Tauri App
        working-directory: frontend
        run: npx tauri build

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: Hazuki-POS-Windows
          path: |
            frontend/src-tauri/target/release/bundle/msi/*.msi
            frontend/src-tauri/target/release/bundle/nsis/*.exe
